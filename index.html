<!-- aria-live="polite" pour accessibilité lecteurs d'écran -->
<div class="alert" id="alert" role="status" aria-live="polite" aria-atomic="true">
  <div class="particles" id="particles"></div>

  <div class="progress-bar" id="progressBar"></div>

  <div class="alert-header">
    <div class="icon" id="icon">❤️</div>
    <div class="info">
      <span class="type" id="type">NOUVEAU FOLLOW</span>
      <div class="username-row">
        <span class="username" id="username">Pseudo</span>
        <!-- message du template perso (ex: "a rejoint la communauté !") -->
        <span class="template-msg" id="templateMsg"></span>
      </div>
    </div>
  </div>
</div>

<!-- Message viewer (ce que le viewer a tapé sur Twitch) affiché sous le widget -->
<div class="viewer-message-bubble" id="message"></div>
